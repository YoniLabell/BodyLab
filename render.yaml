services:
  # ── Backend (FastAPI + Docker) ─────────────────────────────────────────────
  - type: web
    name: bodylab-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh -c "alembic upgrade head && gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bodylab-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: FRONTEND_URL
        value: https://bodylab-frontend.onrender.com

  # ── Frontend (Next.js native Node) ────────────────────────────────────────
  - type: web
    name: bodylab-frontend
    env: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://bodylab-backend.onrender.com
      - key: PORT
        value: "3000"
      - key: NODE_VERSION
        value: "20.12.2"

# ── Database ──────────────────────────────────────────────────────────────────
databases:
  - name: bodylab-db
    plan: free
    databaseName: bodylab
    user: bodylab
