services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: bodylab-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bodylab-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: FRONTEND_URL
        value: https://bodylab-frontend.onrender.com  # Update after first deploy
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  - type: web
    name: bodylab-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://bodylab-backend.onrender.com  # Update after first deploy
      - key: PORT
        value: "3000"
      - key: NODE_VERSION
        value: "20.12.2"

# ── Database ──────────────────────────────────────────────────────────────────
databases:
  - name: bodylab-db
    plan: free
    databaseName: bodylab
    user: bodylab
